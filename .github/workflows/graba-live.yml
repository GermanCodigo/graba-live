name: Grabar Telefe en vivo

on:
  # Corre cada 5 minutos y decide adentro si corresponde grabar,
  # comparando la hora actual (ART) contra config.json. Así el
  # horario/días/on-off se controlan editando config.json (o el
  # panel), sin tener que tocar este archivo cron.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Grabar ahora aunque config.json diga que no corresponde'
        type: boolean
        default: true
      duracion_segundos_prueba:
        description: 'Duración en segundos para esta corrida (vacío = usar config.json)'
        type: string
        default: '20'

jobs:
  chequear:
    runs-on: ubuntu-latest
    outputs:
      debe_grabar: ${{ steps.check.outputs.debe_grabar }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          FORZAR: ${{ inputs.forzar }}
        run: node check-schedule.js

  grabar:
    needs: chequear
    if: needs.chequear.outputs.debe_grabar == 'true'
    # Corre en TU máquina (Mac o Windows, la que esté prendida y con el
    # runner activo), no en un servidor de GitHub — necesario porque el
    # proveedor del stream bloquea IPs fuera de Argentina.
    runs-on: [self-hosted]
    timeout-minutes: 180
    permissions:
      contents: write
    defaults:
      run:
        # Todos los pasos usan sintaxis bash. En Windows, esto usa el
        # bash que trae Git for Windows (ver README-runner-windows.md).
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg no está instalado en esta máquina. Corré el script de instalación (ver README-runner-mac.md / README-runner-windows.md) antes de grabar." >&2
            exit 1
          fi
          ffmpeg -version | head -1

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Instalar navegador de Playwright
        run: npx playwright install chromium

      - name: Leer configuración
        id: cfg
        env:
          DURACION_PRUEBA: ${{ inputs.duracion_segundos_prueba }}
        run: |
          echo "pageurl=$(node -pe 'require("./config.json").pageUrl')" >> "$GITHUB_OUTPUT"
          if [ -n "$DURACION_PRUEBA" ]; then
            echo "duration=$(node -pe "$DURACION_PRUEBA/60")" >> "$GITHUB_OUTPUT"
          else
            echo "duration=$(node -pe 'require("./config.json").durationMinutes')" >> "$GITHUB_OUTPUT"
          fi

      - name: Grabar la transmisión
        id: grabar
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.cfg.outputs.pageurl }}
          DURATION_MINUTES: ${{ steps.cfg.outputs.duration }}
        run: |
          set -o pipefail
          node extract-and-record.js 2>&1 | tee estado.txt

      - name: Subir a Google Drive (si está configurado)
        if: steps.grabar.outcome == 'success'
        env:
          DRIVE_SA_KEY_B64: ${{ secrets.DRIVE_SA_KEY_B64 }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: node upload-to-drive.js

      - name: Guardar también como artifact de la corrida
        if: steps.grabar.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: grabacion-${{ github.run_id }}
          path: grabaciones/*.mp4
          retention-days: 14
          if-no-files-found: warn

      # Los logs normales de Actions viven en Azure Blob Storage; si en
      # algún momento no se pueden ver desde donde estés mirando, este
      # archivo commiteado en el repo es un respaldo simple de leer.
      - name: Publicar estado.txt en el repo
        if: always()
        run: |
          echo "" >> estado.txt
          echo "resultado: ${{ steps.grabar.outcome }}" >> estado.txt
          echo "máquina: $(hostname)" >> estado.txt
          echo "fecha (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> estado.txt
          git config user.name "graba-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f estado.txt
          git commit -m "estado: ${{ steps.grabar.outcome }} (run ${{ github.run_id }})" || echo "nada para commitear"
          git push || echo "no se pudo pushear el estado"

      - name: Fallar el job si la grabación falló
        if: steps.grabar.outcome == 'failure'
        run: exit 1
